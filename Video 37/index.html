<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise 5 - Design a Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body{
            background-color: black;
        }

        nav {
            width: 99vw;
            height: 10vh;
            position: sticky;
            top: 0px;
            z-index: 1;
            background-color: pink;
        }

        .container{
            margin: 20px;
            background-color: green;
            width: 97vw;  
            height: 70vh;  
        }

        .box{
            height: 50vh;
            width: 40vw;
            display: inline-block;
        }

        .box1{
            background-color: pink;
            position: relative;
            top: 10vh;
            left: 5vw;
        }

        .box2{
            background-color: skyblue;
            position: relative;
            top: 10vh;
            left: 10vw;
        }

        .image{
            position: fixed;
            top: 85vh;
            left: 90vw;
        }

        .image img{
            height: 100px;
        }

        .cont{
            margin: 20vh;
            border: 2px solid white;
            height: 25vh;
            border-radius: 50px;
            padding: 20px 0 0 0;
        }

        .cont p{
            color: white;
            font-size: 70px;
            text-align: center;
        }

        .foot{
            width: 99vw;
            height: 10vh;
            background-color: white;
        }
    </style>
</head>

<body>
    <!-- Design This Layout -->
    <nav></nav>

    <main>
        <div class="container">
            <div class="box box1"></div>
            <div class="box box2"></div>
        </div>

        <div class="image">
            <img src="vecteezy_round-circle-logo-icon-no-sign-symbol-red-design-transparent_24382877.png" alt="">
        </div>

        <div class="cont">
            <p>Welcome To Sigma Web Development Express</p>
        </div>
    </main>

    <footer>
        <div class="foot"></div>
    </footer>
</body>

</html>
