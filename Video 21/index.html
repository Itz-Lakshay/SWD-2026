<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>
    <style>
        /* The specificity of universal selector is 0 */
        /* The specificity of element selector is 1 */
        h1{
            color: aqua;
        }
        
        /* The specificity of class selector is 10 */
        .cpurple{
            color: purple;
        }
        
        
        /* The specificity of class selector is 1+10 = 11 */
        h1.yellow{
            color: yellow;
            /* color: blue !important; Specificity becomes 10000*/
        }
        
        /* This is an example of attribute selector.The specificity of class/attribute/pseudo class selector is 10 */
        [data-x="a"]{
            color: maroon;
        }

        /* The specificity of class selector is 10 */
        .cred{
            color: red;
        }

        /* The specificity of this complex selector is 1(element)+10(class)+10(class)+10(attribute)+10(pseudo) = 41 */
        a.harryclass.rohan-class[href]:hover{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <!-- Specificity of inline styles is 1000 -->
    <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
</body>
</html>
