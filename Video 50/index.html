<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(3px);
        } */

        .img1{
            filter: brightness(200%) contrast(200%) opacity(0.3);
        }

        .img2{
            filter: invert(1);
        }

        .img3{
            /* filter: grayscale(50%); */
            filter: sepia(100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://img.magnific.com/free-photo/programming-background-with-person-working-with-codes-computer_23-2150010125.jpg?semt=ais_test_b&w=740&q=80" alt="">
        <img class="img2" src="https://i.ytimg.com/vi/5S3yDoovB9c/maxresdefault.jpg" alt="">
        <img class="img3" src="https://i.ytimg.com/vi/gh5zg3G24tE/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBZm_HeQS5zVTi046dH_mogYXvvsg" alt="">
    </div>
</body>
</html>
