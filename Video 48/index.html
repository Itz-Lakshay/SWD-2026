<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: X-axisAnimation 5s linear infinite,
                       Y-axisAnimation 0.8s ease-out infinite alternate;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes X-axisAnimation {
            from{

            }
            to{
                transform: translateX(72vw);
            }
        }

        @keyframes Y-axisAnimation {
            from{

            }
            to{
                bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>

</body>

</html>
