<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child {
            background-color: aliceblue;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }

        .childContainer {
            background-color: rgb(195, 130, 215);
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
        }

        .container {
            background-color: rgb(61, 129, 188);
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">I am a child</div>
        </section>
    </div>

    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("Child is clicked")
        })

        document.querySelector(".childContainer").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("childContainer is clicked")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("container is clicked")
        })

        function getRandomColor() {
            let val1 = Math.ceil(Math.random() * 255)
            let val2 = Math.ceil(Math.random() * 255)
            let val3 = Math.ceil(Math.random() * 255)

            return `rgb(${val1},${val2},${val3})`
        }

        // let a = setInterval(() => {
        //     document.querySelector(".childContainer").style.backgroundColor = getRandomColor()
        // }, 3000);

        // console.log(a)
        // clearInterval(1)

        let a = setTimeout(() => {
            document.querySelector(".childContainer").style.backgroundColor = getRandomColor()
        }, 3000);

        console.log(a)
        // clearTimeout(1)
    </script>
</body>

</html>
