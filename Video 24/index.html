<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 35px;
            box-shadow: 5px 15px 5px grey;

        }

        .text-shadow{
            text-shadow: 10px 7px 2px #cc9ac6;
            border: 2px solid black;
            outline: 2px solid black;
            outline-offset: 12px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>

    <p class="text-shadow">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Atque eligendi assumenda, deserunt modi hic, est quisquam accusamus, tenetur vel libero error placeat voluptatem eos asperiores reiciendis illum quis molestiae odio. Voluptates autem in id consequuntur?
    </p>
</body>
</html>
