<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 73 - Excercise 13 Dynamic Website Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            background-color: black;
            font-family: "Roboto", sans-serif;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
        }

        .card {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            min-height: 190px;
            padding: 12px 20px;
            background-color: #0f0f0f;
        }

        .thumbnail {
            position: relative;
            width: 288px;
            flex-shrink: 0;
        }

        .thumbnail img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 8px;
        }

        .details p {
            color: white;
            font-size: 25px;
            font-weight: 500;
            line-height: 1.3;
            margin: 0;
        }

        .details .info {
            color: #AAAAAA;
            font-size: 20px;
            font-weight: 400;
        }

        .thumbnail .time {
            position: absolute;
            bottom: 7px;
            right: 7px;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .thumbnail .time p {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            color: white;
            line-height: 1;
        }
    </style>
</head>

<body>
    <div class="container">
    </div>
    <script src="script.js"></script>
</body>

</html>
