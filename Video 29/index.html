<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise 3 - Designing a Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: #eaeff1;
        }

        .main{
            height: auto;
            width: 26vw;
            border: 1px solid grey;
            border-radius: 35px;
            background-color: white;
            position: absolute;
            top: 3vh;
            left: 37vw;
        }

        div img{
            height: 35vh;
            padding: 10px 5px;
            display: block;
            margin: 5px auto;
            border-radius: 35px;
        }

        .capsule{
            margin: 20px 15px;
        }

        .capsule span{
            border: 1px solid grey;
            border-radius: 125px;
            padding: 5px 10px;
            margin: 5px 10px;
            font-size: 15px;
            color: grey;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        div h2{
            padding: 10px;
            margin: 20px 15px;
            font-size: 40px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: 600;
            color: #0e2632eb;
        }

        div p{
            width: 90%;
            margin: 15px auto;
            font-size: 20px;
            color: grey;
            font-weight: 100;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .btn p{
            margin: 35px auto;
            padding: 10px;
            background-color: #e0efff;
            color: #52a3ff;
            text-align: center;
            border-radius: 25px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 15px;
            font-weight: 600;
        }

        .btn{
            width: 30%;
            margin: auto;
        }
    </style>
</head>
<body>
    <!-- card.png is a file which contains a card Image. write html and css code to design this card. -->

    <div class="main">
        <img src="https://static.india.com/wp-content/uploads/2022/04/pjimage-2022-04-07T162318.117.jpg" alt="Lake Image">

        <div class="capsule">
            <span>Nature</span>
            <span>Lake</span>
        </div>

        <h2>Lago Di Braies</h2>

        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta officia at facere aliquid assumenda id sit ipsa voluptatibus.</p>

        <div class="btn">
            <p>Read More</p>
        </div>

    </div>
</body>
</html>
