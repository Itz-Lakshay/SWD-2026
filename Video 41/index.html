    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* header{
            position: sticky;

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* gap: 400px; wrong approach */
            margin: auto;
            padding: 10px;

        }

        nav ul {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav ul li {
            list-style: none;
            display: flex;
            gap: 5px;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
